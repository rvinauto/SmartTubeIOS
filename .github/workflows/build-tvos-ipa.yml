name: Build unsigned tvOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - build/tvos-ipa
      - feature/tvos-youtube-ui

permissions:
  contents: read

concurrency:
  group: tvos-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tvos-ipa:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select upstream-compatible Xcode and show SDKs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d /Applications/Xcode_26.6.app ]]; then
            echo "Xcode 26.6 is not present on this runner. Available Xcodes:"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          swift --version
          xcodebuild -showsdks

      - name: Prepare fork-safe build configuration
        shell: bash
        run: |
          set -euo pipefail
          cp SmartTubeApp/Config/Secrets.xcconfig.example SmartTubeApp/Config/Secrets.xcconfig

          python3 - <<'PY'
          from pathlib import Path
          plist = '''<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key><string>SELF_BUILD_DISABLED</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>PLIST_VERSION</key><string>1</string>
            <key>BUNDLE_ID</key><string>com.void.smarttube</string>
            <key>PROJECT_ID</key><string>smarttube-self-build</string>
            <key>STORAGE_BUCKET</key><string>smarttube-self-build.invalid</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><false/>
            <key>IS_GCM_ENABLED</key><false/>
            <key>IS_SIGNIN_ENABLED</key><false/>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
          </dict>
          </plist>
          '''
          for rel in ('SmartTubeApp/Smart Tube/GoogleService-Info.plist',
                      'SmartTubeApp/SmartTubeApp/GoogleService-Info.plist'):
              p = Path(rel)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(plist, encoding='utf-8')
          PY

          plutil -lint "SmartTubeApp/Smart Tube/GoogleService-Info.plist"
          plutil -lint "SmartTubeApp/SmartTubeApp/GoogleService-Info.plist"

      - name: Complete Simplified Chinese localization
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_zh_hans_localization.py

      - name: Apply YouTube TV UI and metadata locale overlay
        if: github.ref == 'refs/heads/feature/tvos-youtube-ui'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_tvos_youtube_ui.py

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace SmartTube.xcworkspace \
            -scheme "Smart Tube"

      - name: Build unsigned tvOS device app
        shell: bash
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/SmartTubeDerivedData"
          xcodebuild build \
            -workspace SmartTube.xcworkspace \
            -scheme "Smart Tube" \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            | tee "$RUNNER_TEMP/tvos-build.log"

      - name: Build and embed Top Shelf extension
        shell: bash
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/SmartTubeDerivedData"
          APP_PATH="$DERIVED_DATA/Build/Products/Release-appletvos/Smart Tube.app"
          APPEX="$APP_PATH/PlugIns/SmartTubeTopShelf.appex"
          SDKROOT="$(xcrun --sdk appletvos --show-sdk-path)"

          test -d "$APP_PATH"
          mkdir -p "$APPEX"
          ditto SmartTubeApp/TopShelf/Info.plist "$APPEX/Info.plist"

          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          APP_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$APPEX/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $APP_BUILD" "$APPEX/Info.plist"

          xcrun --sdk appletvos swiftc \
            -O \
            -parse-as-library \
            -application-extension \
            -target arm64-apple-tvos17.6 \
            -sdk "$SDKROOT" \
            -module-name SmartTubeTopShelf \
            SmartTubeApp/TopShelf/ContentProvider.swift \
            -framework Foundation \
            -framework TVServices \
            -Xlinker -e -Xlinker _NSExtensionMain \
            -Xlinker -application_extension \
            -o "$APPEX/SmartTubeTopShelf"

          plutil -lint "$APPEX/Info.plist"
          file "$APPEX/SmartTubeTopShelf"
          otool -L "$APPEX/SmartTubeTopShelf"
          echo "Embedded Top Shelf extension:"
          find "$APPEX" -maxdepth 1 -type f -print

      - name: Package IPA
        id: package
        shell: bash
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/SmartTubeDerivedData"
          APP_PATH="$DERIVED_DATA/Build/Products/Release-appletvos/Smart Tube.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "Expected app not found at: $APP_PATH"
            find "$DERIVED_DATA/Build/Products" -maxdepth 3 -name '*.app' -print || true
            exit 1
          fi

          APPEX="$APP_PATH/PlugIns/SmartTubeTopShelf.appex"
          test -x "$APPEX/SmartTubeTopShelf"
          test -f "$APPEX/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APPEX/Info.plist"

          OUT="$RUNNER_TEMP/SmartTubeIPA"
          mkdir -p "$OUT/Payload"
          ditto "$APP_PATH" "$OUT/Payload/Smart Tube.app"

          BIN="$OUT/Payload/Smart Tube.app/Smart Tube"
          file "$BIN"
          lipo -info "$BIN" || true
          find "$OUT/Payload/Smart Tube.app/PlugIns" -maxdepth 2 -print

          SHORT_SHA="${GITHUB_SHA::7}"
          IPA="SmartTube-tvOS-top-shelf-${SHORT_SHA}.ipa"
          (
            cd "$OUT"
            /usr/bin/zip -qry "$IPA" Payload
          )

          echo "ipa=$OUT/$IPA" >> "$GITHUB_OUTPUT"
          echo "name=$IPA" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT/$IPA"

      - name: Upload unsigned tvOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube-tvOS-top-shelf-${{ github.sha }}
          path: ${{ steps.package.outputs.ipa }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tvos-build-log-${{ github.sha }}
          path: ${{ runner.temp }}/tvos-build.log
          if-no-files-found: ignore
          retention-days: 7
